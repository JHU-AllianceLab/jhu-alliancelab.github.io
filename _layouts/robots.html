---
layout: default
show_sidebar: false
---

{{ page.content }}

<h2 class="team-section-title">Robots</h2>
<div class="columns is-multiline">
  {% assign sorted_robots = site.robots | sort: "order" %}
  {% for product in sorted_robots %}
  <div class="column is-3-desktop is-6-tablet reveal delay-{{ forloop.index | modulo: 4 | plus: 1 }}">
    <a href="{% if product.external_link %}{{ product.external_link }}{% else %}{{ product.url | absolute_url }}{% endif %}"
      {% if product.external_link %}target="_blank" rel="noopener" {% endif %}>
      <div class="card team-card">
        {% if product.image %}
        <div class="card-image">
          <img src="{{ product.image | absolute_url }}" alt="{{ product.title }}" />
        </div>
        {% endif %}
        <div class="card-content">
          <p class="title is-5">{{ product.title }}</p>
          <p class="subtitle is-6">{{ product.subtitle }}</p>
        </div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
